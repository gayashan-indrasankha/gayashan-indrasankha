<svg xmlns="http://www.w3.org/2000/svg" width="420" height="112" viewBox="0 0 420 112" role="img" aria-labelledby="title desc">
  <title id="title">Open to Software Engineering roles</title>
  <desc id="desc">Open to Software Engineering internships and graduate positions. Select to send an email.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.3px; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <rect x="3.5" y="3.5" width="413" height="105" rx="16" fill="#0D1117" stroke="#30363D"/>
  <rect x="3.5" y="28" width="4" height="56" rx="2" fill="#3FC7A6"/>
  <circle class="pulse" cx="31" cy="30" r="3.5" fill="#3FC7A6"/>
  <circle cx="31" cy="30" r="3.5" fill="#3FC7A6"/>
  <text x="42" y="34" class="label mono" fill="#72DCC1">OPEN TO</text>
  <text x="27" y="63" font-size="20" font-weight="700" letter-spacing="-.3" fill="#F0F3F8">Software Engineering roles</text>
  <text x="27" y="87" font-size="13.5" fill="#AEB7C4">Internships and graduate positions</text>
  <rect x="312" y="38" width="81" height="36" rx="18" fill="#3FC7A6"/>
  <text x="352.5" y="61" font-size="13.5" font-weight="700" fill="#0D1117" text-anchor="middle">Email ↗</text>
</svg>
