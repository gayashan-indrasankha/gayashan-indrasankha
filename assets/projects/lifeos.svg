<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 186" width="460" height="186" role="img" aria-labelledby="t d">
  <title id="t">LifeOS</title>
  <desc id="d">Connects long-term goals to weekly plans, daily tasks and habits. Built solo, with tests running in GitHub Actions.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
