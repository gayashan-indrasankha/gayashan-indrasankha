  <rect x="99" y="148" width="62" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
  <text class="chip mono" x="130" y="164" text-anchor="middle">Python</text>
  <rect x="169" y="148" width="91" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
  <text class="chip mono" x="214.5" y="164" text-anchor="middle">PostgreSQL</text>
  <rect x="268" y="148" width="62" height="24" rx="12" fill="#161B22" stroke="#30363D"/>
