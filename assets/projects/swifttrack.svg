<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 186" width="460" height="186" role="img" aria-labelledby="t d">
  <title id="t">SwiftTrack Middleware</title>
  <desc id="d">API gateway bridging SOAP, REST and TCP systems with saga coordination, so no order is lost when a service goes down.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
