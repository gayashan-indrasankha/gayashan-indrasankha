<svg xmlns="http://www.w3.org/2000/svg" width="420" height="372" viewBox="0 0 420 372" role="img" aria-labelledby="title desc">
  <title id="title">LifeOS, built end to end by one developer</title>
  <desc id="desc">A live production app covering product, data model, backend, UI, tests, CI/CD and packaging. About 21,500 lines of TypeScript, 61 automated test suites and 37 database tables. A real-data performance fix made its Week page 88 percent smaller, from 6.46 MB to 0.79 MB.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121C22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#3FC7A6"/>
      <stop offset="1" stop-color="#7C9CF5"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    .label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.3px; }
    .body { font-size: 14.5px; fill: #C9D1D9; }
    .stat { font-size: 27px; font-weight: 700; letter-spacing: -.5px; fill: #F0F3F8; }
    .cap { font-size: 12.5px; fill: #9AA4B5; }
    .val { font-size: 12.5px; fill: #C9D1D9; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <rect x="3.5" y="3.5" width="413" height="365" rx="16" fill="url(#surface)" stroke="#30363D"/>
  <path d="M27 4H393" stroke="url(#accent)" stroke-opacity=".8"/>

  <text x="27" y="37" class="label mono" fill="#72DCC1">BUILT SOLO</text>
  <circle class="pulse" cx="352" cy="33" r="3.5" fill="#3FC7A6"/>
  <circle cx="352" cy="33" r="3.5" fill="#3FC7A6"/>
  <text x="393" y="37" class="label mono" fill="#C9D1D9" text-anchor="end">LIVE</text>

  <text x="27" y="77" font-size="30" font-weight="700" letter-spacing="-.7" fill="#F0F3F8">LifeOS, end to end.</text>
  <text x="27" y="104" class="body">Product, data model, backend, UI, tests,</text>
  <text x="27" y="125" class="body">CI/CD and packaging, by one developer.</text>

  <path d="M27 146H393" stroke="#262C36"/>
  <text x="27" y="182" class="stat">21.5K</text>
  <text x="27" y="202" class="cap">lines of TypeScript</text>
  <path d="M155 162V206" stroke="#262C36"/>
  <text x="170" y="182" class="stat">61</text>
  <text x="170" y="202" class="cap">automated test suites</text>
  <path d="M306 162V206" stroke="#262C36"/>
  <text x="321" y="182" class="stat">37</text>
  <text x="321" y="202" class="cap">DB tables</text>
  <path d="M27 222H393" stroke="#262C36"/>

  <text x="27" y="250" class="label mono" fill="#9AA4B5">REAL-DATA PERFORMANCE FIX</text>
  <text x="27" y="284" font-size="24" font-weight="700" letter-spacing="-.4" fill="#F0F3F8">88% smaller page</text>

  <text x="27" y="316" class="cap">Before</text>
  <rect x="78" y="306" width="255" height="12" rx="4" fill="#465063"/>
  <text x="393" y="316" class="val" text-anchor="end">6.46 MB</text>
  <text x="27" y="344" class="cap">After</text>
  <rect x="78" y="334" width="31" height="12" rx="4" fill="#3FC7A6"/>
  <text x="393" y="344" class="val" text-anchor="end">0.79 MB</text>
</svg>
