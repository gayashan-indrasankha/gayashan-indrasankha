<svg xmlns="http://www.w3.org/2000/svg" width="844" height="164" viewBox="0 0 844 164" role="img" aria-labelledby="title desc">
  <title id="title">I turn real problems into reliable software.</title>
  <desc id="desc">A tangled amber line, standing for a real problem, straightens into a clean line that ends at a single point, standing for reliable software.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1">
      <stop offset="0" stop-color="#201A10"/>
      <stop offset=".5" stop-color="#101820"/>
      <stop offset="1" stop-color="#17172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#F0A94A"/>
      <stop offset=".5" stop-color="#3FC7A6"/>
      <stop offset="1" stop-color="#B98AF0"/>
    </linearGradient>
    <linearGradient id="words" gradientUnits="userSpaceOnUse" x1="470" y1="0" x2="780" y2="0">
      <stop stop-color="#3FC7A6"/>
      <stop offset=".55" stop-color="#7C9CF5"/>
      <stop offset="1" stop-color="#B98AF0"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="784" y2="0">
      <stop stop-color="#F0A94A"/>
      <stop offset=".42" stop-color="#F0A94A"/>
      <stop offset=".58" stop-color="#3FC7A6"/>
      <stop offset=".8" stop-color="#7C9CF5"/>
      <stop offset="1" stop-color="#B98AF0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(2.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } .runner { display: none; } }
  </style>
  <rect x="3.5" y="3.5" width="837" height="157" rx="16" fill="url(#surface)" stroke="#30363D"/>
  <path d="M27 4H817" stroke="url(#accent)" stroke-opacity=".8"/>

  <text x="422" y="60" text-anchor="middle" font-size="34" font-weight="700" letter-spacing="-.6" fill="#F0F3F8">I turn <tspan fill="#F0A94A">real problems</tspan> into <tspan fill="url(#words)">reliable software.</tspan></text>

  <g aria-hidden="true">
    <path id="route" d="M60 112C80 80 100 140 120 108S150 78 165 118S130 140 165 96S215 78 205 124S170 130 225 92S275 100 255 130S245 84 300 108S345 120 400 112H784" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="520" cy="112" r="5" fill="#0D1117" stroke="#3FC7A6" stroke-width="2"/>
    <circle cx="640" cy="112" r="5" fill="#0D1117" stroke="#7C9CF5" stroke-width="2"/>
    <circle class="pulse" cx="784" cy="112" r="7" fill="#B98AF0"/>
    <circle cx="784" cy="112" r="7" fill="#B98AF0"/>
    <g class="runner">
      <circle r="4" fill="#F0F3F8">
        <animateMotion dur="8s" repeatCount="indefinite" path="M60 112C80 80 100 140 120 108S150 78 165 118S130 140 165 96S215 78 205 124S170 130 225 92S275 100 255 130S245 84 300 108S345 120 400 112H784"/>
      </circle>
    </g>
  </g>
</svg>
